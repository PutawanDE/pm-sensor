esphome:
  name: esphome-web-e81744
  friendly_name: PM Sensor
  min_version: 2026.3.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600

sensor:
  - platform: pmsx003
    type: PMSX003
    id: pm_sensor
    pm_1_0:
      id: pm1
      name: "Particulate Matter <1.0µm Concentration"
    pm_2_5:
      id: pm25
      name: "Particulate Matter <2.5µm Concentration"
    pm_10_0:
      id: pm10
      name: "Particulate Matter <10.0µm Concentration"
    update_interval: 120s

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
    glyphsets: [GF_Latin_Kernel, GF_Latin_Plus]

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    lambda: |-
      // Row 1 - PM2.5
      if(isnan(id(pm25).state) || isnan(id(pm10).state)) {
        it.print(0, 0, id(font_small), "Loading...");
        return;
      }

      it.printf(0, 0, id(font_small),
        "PM2.5: %.1f µm/m³", id(pm25).state);

      // Row 2 - PM10
      it.printf(0, 18, id(font_small),
        "PM10 : %.1f µm/m³", id(pm10).state);

      // Row 3 - Status (AQI style)
      if (isnan(id(pm25).state)) {
        return;
      } else if (id(pm25).state <= 12) {
        it.print(0, 40, id(font_small), "AQI: GOOD :)");
      } else if (id(pm25).state <= 35) {
        it.print(0, 40, id(font_small), "AQI: MODERATE");
      } else {
        it.print(0, 40, id(font_small), "AQI: BAD !");
      }
